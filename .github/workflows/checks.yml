# Проверки кода на каждый push в dev/main и PR (plan/new/code_cleanup.md, Clean 7).
# Те же команды, что локально; все шаги выполняются, даже если предыдущий упал, — сразу видно всё.
name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node (как engines в package.json)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: ESLint
        if: success() || failure()
        run: npm run lint

      - name: Prettier
        if: success() || failure()
        run: npm run format:check

      - name: TypeScript
        if: success() || failure()
        run: npm run type-check

      - name: Jest
        if: success() || failure()
        run: npx jest --ci

      - name: Brand check
        if: success() || failure()
        run: npm run brand:check -- --fail-on-new

      - name: Migrations
        if: success() || failure()
        run: npm run db:check-migrations
